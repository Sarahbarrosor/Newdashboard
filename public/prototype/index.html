<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cellgenic — Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      html, body { margin: 0; padding: 0; background: #FCFCFD; font-family: Inter, sans-serif; color: #15151A; }
      #root { min-height: 100vh; }
      .prototype-banner {
        position: fixed; top: 12px; right: 12px; z-index: 50;
        background: #15151A; color: #fff; padding: 6px 12px;
        border-radius: 999px; font-size: 11px; font-weight: 500;
        letter-spacing: 0.04em; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="prototype-banner">Prototype — visual reference only</div>
    <div id="root"></div>

    <script type="text/babel" src="./mock-data.js"></script>
    <script type="text/babel" src="./ui-components.js"></script>
    <script type="text/babel">
      const { useState } = React;

      function PrototypePreview() {
        const countries = window.COUNTRIES;
        const [country, setCountry] = useState('US');
        const kpi = window.KPI[country];
        const stock = window.STOCK;
        const transfers = window.TRANSFERS;

        return (
          <div style={{ maxWidth: 1200, margin: '0 auto', padding: 32 }}>
            <header style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', marginBottom: 32 }}>
              <div>
                <div style={{ fontSize: 11, letterSpacing: '0.1em', textTransform: 'uppercase', color: '#9A9AA6', fontWeight: 500 }}>
                  Cellgenic Operations
                </div>
                <h1 style={{ fontFamily: 'Fraunces, serif', fontWeight: 300, fontSize: 40, letterSpacing: '-0.02em', margin: '8px 0 0' }}>
                  Logistics dashboard
                </h1>
              </div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                {countries.map((c) => (
                  <button
                    key={c.code}
                    onClick={() => setCountry(c.code)}
                    style={{
                      padding: '6px 14px', borderRadius: 999, fontSize: 13, fontWeight: 500,
                      border: '1px solid ' + (country === c.code ? '#A06090' : '#E8E8ED'),
                      background: country === c.code ? '#FAF2F7' : '#fff',
                      color: country === c.code ? '#8C4F7E' : '#3E3E48',
                      cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 6,
                    }}
                  >
                    <span>{c.flag}</span>{c.code}
                  </button>
                ))}
              </div>
            </header>

            <section style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16, marginBottom: 32 }}>
              {[
                { label: 'Total SKUs', value: kpi.skus },
                { label: 'Low stock', value: kpi.lowStock },
                { label: 'Pending transfers', value: kpi.pendingIn },
                { label: 'MTD revenue', value: '$' + kpi.mtdRev.toLocaleString() },
              ].map((k) => (
                <window.Card key={k.label} padding={20}>
                  <div style={{ fontSize: 11, letterSpacing: '0.1em', textTransform: 'uppercase', color: '#9A9AA6' }}>{k.label}</div>
                  <div style={{ fontFamily: 'Fraunces, serif', fontSize: 32, fontWeight: 400, marginTop: 8 }}>{k.value}</div>
                </window.Card>
              ))}
            </section>

            <window.Card>
              <window.SectionHead title="Inventory" overline={country} />
              <div style={{ overflowX: 'auto' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
                  <thead>
                    <tr style={{ textAlign: 'left', color: '#9A9AA6', fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.06em' }}>
                      <th style={{ padding: '12px 0', fontWeight: 500 }}>SKU</th>
                      <th style={{ padding: '12px 0', fontWeight: 500 }}>Product</th>
                      {countries.map((c) => (
                        <th key={c.code} style={{ padding: '12px 8px', fontWeight: 500, textAlign: 'right' }}>{c.flag} {c.code}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {stock.map((row) => (
                      <tr key={row.sku} style={{ borderTop: '1px solid #F1F1F4' }}>
                        <td style={{ padding: '14px 0', fontFamily: 'JetBrains Mono, monospace', fontSize: 11.5, color: '#3E3E48' }}>{row.sku}</td>
                        <td style={{ padding: '14px 0', color: '#15151A' }}>{row.name}</td>
                        {countries.map((c) => (
                          <td key={c.code} style={{ padding: '14px 8px', textAlign: 'right', fontVariantNumeric: 'tabular-nums', color: c.code === country ? '#15151A' : '#9A9AA6', fontWeight: c.code === country ? 500 : 400 }}>
                            {row[c.code]}
                          </td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </window.Card>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<PrototypePreview />);
    </script>
  </body>
</html>
